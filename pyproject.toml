[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-attitude-control"
version = "0.1.0"
description = "Reproducible A2C-based rocket attitude-control simulation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Yu Siwei" }]
keywords = ["reinforcement-learning", "rocket", "attitude-control", "gymnasium", "a2c"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium==0.28.1",
  "imageio>=2.31,<3",
  "imageio-ffmpeg>=0.4.9,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "opencv-python-headless==4.10.0.84",
  "pygame>=2.5,<3",
  "stable-baselines3==2.3.2",
  "torch>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
rocket-train = "rocket_attitude_control.cli.train:main"
rocket-evaluate = "rocket_attitude_control.cli.evaluate:main"
rocket-render = "rocket_attitude_control.cli.render:main"

[project.urls]
Repository = "https://github.com/yusiwei77-star/rocket-attitude-control"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["regression: runs the full 20-seed policy regression"]
